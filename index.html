<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<title>Farm Inventory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">🌾</span><div><h1>Farm Inventory</h1><p class="sub">Yard, shop &amp; bins at a glance</p></div></div>
  <div class="top-actions">
    <button class="btn scan-btn" id="scanBtn" aria-label="Scan a barcode">📷 Scan</button>
    <button class="btn primary" id="addBtn">+ Add item</button>
    <div class="menu-wrap">
      <button class="btn ghost" id="menuBtn" aria-haspopup="true" aria-expanded="false">⋯ Data</button>
      <div class="menu" id="menu" hidden>
        <button data-action="export-csv">Export CSV</button>
        <button data-action="export-json">Backup (JSON)</button>
        <button data-action="import-json">Import backup (JSON)</button>
        <button data-action="load-examples">Load example data</button>
        <button data-action="clear-examples" class="danger-text">Clear example data</button>
      </div>
    </div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</header>

<main class="wrap">
  <div class="banner" id="exampleBanner" hidden>
    <span>👋 You're looking at <strong>example data</strong> (tagged “Example”). Add your own items, then clear these out.</span>
    <button class="btn small" id="clearExamplesBtn">Clear example data</button>
  </div>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <section class="card value-card" id="valueCard" aria-label="Inventory value"></section>

  <section class="card breakdown" aria-label="By category">
    <h2>By category</h2>
    <div id="breakdown"></div>
  </section>

  <section class="controls" aria-label="Search and filters">
    <input type="search" id="search" placeholder="Search name, barcode, supplier, notes…" aria-label="Search">
    <select id="filterCategory" aria-label="Filter by category"><option value="">All categories</option></select>
    <select id="filterLocation" aria-label="Filter by location"><option value="">All locations</option></select>
    <select id="sortBy" aria-label="Sort">
      <option value="name">Sort: Name</option>
      <option value="qty">Sort: Quantity</option>
      <option value="updated">Sort: Last updated</option>
    </select>
    <label class="chk"><input type="checkbox" id="lowOnly"> Low stock only</label>
  </section>

  <section id="list" class="list" aria-live="polite"></section>
</main>

<!-- Item form dialog -->
<dialog id="itemDialog">
  <form id="itemForm" method="dialog" novalidate>
    <h2 id="itemDialogTitle">Add item</h2>
    <div class="grid">
      <label class="full">Name*<input name="name" required maxlength="80"></label>
      <label>Category<select name="category" id="fCategory"></select></label>
      <label>Location<input name="location" list="locationList" placeholder="e.g. Bin 3, Shop, Quonset"></label>
      <label>Quantity<input name="quantity" type="number" step="any" min="0" inputmode="decimal" value="0"></label>
      <label>Unit<select name="unit" id="fUnit"></select></label>
      <label>Low-stock alert at<input name="threshold" type="number" step="any" min="0" inputmode="decimal" value="0"></label>
      <label>Cost per unit (CAD)<input name="cost" type="number" step="0.01" min="0" inputmode="decimal" placeholder="optional"></label>
      <label class="full">Market price link
        <select name="commodity" id="fCommodity"></select>
      </label>
      <div class="full price-fields" id="priceFields" hidden>
        <div class="grid">
          <label id="basisWrap"><span id="basisLabel">Basis (+/− CAD per unit)</span><input name="basis" type="number" step="any" inputmode="decimal" placeholder="e.g. -1.20"></label>
          <label id="headWeightWrap" hidden>Avg weight per head (lb)<input name="headWeight" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 850"></label>
          <label><span id="marketPriceLabel">Your price (CAD per unit)</span><input name="marketPrice" type="number" step="any" min="0" inputmode="decimal" placeholder="optional"></label>
        </div>
        <p class="price-preview" id="pricePreview" aria-live="polite"></p>
      </div>
      <label class="full">Barcode
        <span class="input-with-btn"><input name="barcode" id="fBarcode" maxlength="64" autocomplete="off" placeholder="optional — scan or type"><button type="button" class="btn small" id="formScanBtn" aria-label="Scan barcode into this field">📷 Scan</button></span>
      </label>
      <label class="full">Supplier<input name="supplier" placeholder="optional"></label>
      <label class="full">Notes<textarea name="notes" rows="2"></textarea></label>
    </div>
    <p class="error" id="formError" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>
<datalist id="locationList"></datalist>

<!-- Log usage/delivery dialog -->
<dialog id="logDialog">
  <form id="logForm" method="dialog">
    <h2 id="logTitle">Log usage / delivery</h2>
    <p class="muted" id="logCurrent"></p>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="kind" value="use" checked> Used / out</label>
      <label><input type="radio" name="kind" value="delivery"> Delivery / in</label>
      <label><input type="radio" name="kind" value="count"> Set count</label>
    </div>
    <div class="grid">
      <label>Amount<input name="amount" type="number" step="any" min="0" inputmode="decimal" required></label>
      <label>Date<input name="date" type="date" required></label>
      <label class="full">Note<input name="note" placeholder="e.g. Fed to heifers, Co-op delivery"></label>
    </div>
    <p class="error" id="logError" hidden></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save entry</button>
    </div>
  </form>
</dialog>

<!-- History dialog -->
<dialog id="historyDialog">
  <div class="dialog-body">
    <h2 id="historyTitle">History</h2>
    <div id="historyList"></div>
    <div class="dialog-actions"><button type="button" class="btn primary" data-close>Close</button></div>
  </div>
</dialog>

<!-- Scanner dialog -->
<dialog id="scanDialog">
  <div class="dialog-body">
    <h2 id="scanTitle" tabindex="-1" autofocus>Scan a barcode</h2>
    <div class="scan-view" id="scanView">
      <video id="scanVideo" playsinline muted hidden></video>
      <div id="scanReader"></div>
      <div class="scan-frame" id="scanFrame" hidden></div>
    </div>
    <p class="scan-status" id="scanStatus" role="status">Starting camera…</p>
    <form id="manualForm" class="manual-form" novalidate>
      <label for="manualCode">Or type the barcode number</label>
      <div class="input-with-btn">
        <input id="manualCode" name="code" inputmode="text" autocomplete="off" maxlength="64" placeholder="e.g. 064200116459">
        <button type="submit" class="btn primary" id="manualGo">Look up</button>
      </div>
    </form>
    <div class="dialog-actions"><button type="button" class="btn ghost" data-close>Cancel</button></div>
  </div>
</dialog>

<!-- Scan result dialog -->
<dialog id="scanResultDialog">
  <div class="dialog-body" id="scanResult"></div>
</dialog>

<!-- Confirm dialog -->
<dialog id="confirmDialog">
  <div class="dialog-body">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMsg"></p>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="confirmNo">Cancel</button>
      <button type="button" class="btn danger" id="confirmYes">Delete</button>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
